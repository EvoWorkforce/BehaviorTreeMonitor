[project]
name = "evo-behavior-tree-monitor"
version = "1.0.0"
description = "Live monitor for BehaviorTree.CPP through the Groot2 protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
qt = [
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
]

[project.scripts]
evo-behavior-tree-monitor = "bt_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["bt_monitor/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["bt_monitor"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest",
    "pytest-asyncio",
]
